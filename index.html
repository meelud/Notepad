<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notepad</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
<base target="_blank">
</head>
<body>

  <img id="mark" src="favicon.png" alt="" draggable="false">

  <div id="barRow">
    <div id="bar">
      <span class="rivet tl"></span>
      <span class="rivet tr"></span>
      <span class="rivet bl"></span>
      <span class="rivet br"></span>
      <button class="btn go" id="bPlay" disabled>play <span class="key">⇧↵</span></button>
      <button class="btn" id="bStop" disabled>stop <span class="key">esc</span></button>
      <button class="btn" id="bSave" disabled>save <span class="key">⌘s</span></button>
      <button class="btn" id="bClear">clear</button>
      <span id="wc">0 words</span>
    </div>
    <button id="themeToggle" type="button" aria-label="Toggle light theme" title="Toggle theme"></button>
  </div>

  <div id="wrap">
    <div id="ph">Write anything.</div>
    <textarea id="editor" dir="auto" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <div id="render" dir="auto"></div>
  </div>


  <div id="feedback">
    <span>if something feels off, ping me</span>
    <a href="https://t.me/yuasexua" target="_blank" rel="noopener" id="feedback-pin">🧷</a>
  </div>

  <div id="toast"></div>

  <script>
    // Self-contained theme toggle — deliberately not wired through the
    // module system (dom.js/ui.js) to avoid touching files whose current
    // state isn't in hand here. Purely additive: flips a class on <html>
    // that the stylesheet's light-theme block below reads. No persistence
    // by design (resets to dark on reload), keeping the footprint minimal.
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
    });
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
